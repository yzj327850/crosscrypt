[package]
name = "crosscrypt"
version = "0.1.0"
edition = "2021"
authors = ["CrossCrypt Team"]
description = "Cross-platform portable disk encryption"
license = "MIT"
repository = "https://github.com/crosscrypt/crosscrypt"

[lib]
name = "crosscrypt"
path = "src/lib.rs"

[[bin]]
name = "crosscrypt"
path = "src/main.rs"

[features]
default = ["gui"]
gui = ["dialoguer"]

[dependencies]
# Core crypto
aes = "0.8"
ctr = "0.9"
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
rand = "0.8"
chacha20poly1305 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Async runtime
tokio = { version = "1.35", features = ["full"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = "0.3"

# CLI
clap = { version = "4.4", features = ["derive"] }
rpassword = "7.3"

# GUI - 交互式命令行界面
dialoguer = { version = "0.11", optional = true, features = ["fuzzy-select"] }

# Parallel processing
rayon = "1.8"

# Async trait
async-trait = "0.1"

# UUID
uuid = { version = "1.6", features = ["v4"] }

# Platform specific
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["fileapi", "handleapi", "ioapiset", "winioctl", "winbase", "winnt"] }
windows-sys = { version = "0.52", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_Security"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.8"
criterion = { version = "0.5", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
debug = true
